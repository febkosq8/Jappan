services:
    jappan:
        image: ghcr.io/febkosq8/jappan:latest
        container_name: jappan
        restart: unless-stopped
        env_file:
            - .env
        volumes:
            - ./logs:/app/logs
        command: ["bash", "-c", "exec node dist/index.js > >(tee -a /app/logs/docker.log) 2>&1"]
        ports:
            - "${HOST_PORT:-8875}:${PORT:-8875}"
