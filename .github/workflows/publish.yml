name: Publish

on:
    workflow_dispatch:
        inputs:
            create_tag:
                description: Create and push the version Git tag
                type: boolean
                default: true
            create_release:
                description: Create a GitHub release for the version tag
                type: boolean
                default: true
            publish_docker:
                description: Build and publish the Docker image
                type: boolean
                default: true

permissions:
    contents: write
    packages: write

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              if: inputs.publish_docker
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              if: inputs.publish_docker
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Read version from package.json
              id: version
              run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Extract metadata
              if: inputs.publish_docker
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=${{ steps.version.outputs.value }}
                      type=raw,value=latest

            - name: Build and push Docker image
              if: inputs.publish_docker
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Create and push Git tag
              if: inputs.create_tag
              env:
                  VERSION: ${{ steps.version.outputs.value }}
              run: |
                  tag="v${VERSION}"
                  git tag "$tag" "$GITHUB_SHA"
                  git push origin "$tag"

            - name: Create GitHub release
              if: inputs.create_release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ steps.version.outputs.value }}
              run: |
                  tag="v${VERSION}"
                  gh release create "$tag" \
                      --title "$tag" \
                      --verify-tag \
                      --generate-notes

            - name: Print published image and tags
              if: success() && inputs.publish_docker
              env:
                  TAGS: ${{ steps.meta.outputs.tags }}
              run: |
                  number=1
                  printf '%s\n' "$TAGS" | while IFS= read -r tag; do
                      [ -n "$tag" ] || continue
                      printf '%d. %s\n' "$number" "$tag"
                      number=$((number + 1))
                  done
