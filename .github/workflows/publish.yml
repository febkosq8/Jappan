name: Publish

on:
    workflow_dispatch:
        inputs:
            version_override:
                description: Version to publish instead of the package.json version (leave empty to use package.json)
                type: string
                default: ""
            create_tag:
                description: Create and push the version Git tag
                type: boolean
                default: true
            create_release:
                description: Create a GitHub release for the version tag
                type: boolean
                default: true
            publish_docker:
                description: Build and publish the Docker image
                type: boolean
                default: true

permissions:
    contents: write
    packages: write

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    prepare:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.release-info.outputs.version }}
            release_notes: ${{ steps.release-info.outputs.release_notes }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Prepare release preview
              id: release-info
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CREATE_RELEASE: ${{ inputs.create_release }}
                  CREATE_TAG: ${{ inputs.create_tag }}
                  PUBLISH_DOCKER: ${{ inputs.publish_docker }}
                  IMAGE_NAME: ${{ env.REGISTRY }}/${{ github.repository }}
                  VERSION_OVERRIDE: ${{ inputs.version_override }}
              run: |
                  node --input-type=module -e '
                    import { appendFileSync, readFileSync } from "node:fs";
                    import { randomUUID } from "node:crypto";

                    const override = process.env.VERSION_OVERRIDE.trim();
                    if (override && !/^[0-9A-Za-z][0-9A-Za-z._-]*$/.test(override)) {
                      throw new Error(`Invalid version override: ${override}`);
                    }
                    const version = override || JSON.parse(readFileSync("package.json", "utf8")).version;
                    appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);

                    let summary = `## Publish preview\n\nVersion: \`v${version}\`\n\n`;
                    summary += `- Create Git tag: ${process.env.CREATE_TAG}\n`;
                    summary += `- Create GitHub release: ${process.env.CREATE_RELEASE}\n`;
                    summary += `- Publish Docker image: ${process.env.PUBLISH_DOCKER}\n`;
                    if (process.env.CREATE_RELEASE === "true") {
                      const heading = `## [${version}]`;
                      const lines = readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
                      const start = lines.findIndex(
                        (line) => line === heading || line.startsWith(`${heading} -`),
                      );

                      if (start === -1) {
                        throw new Error(`No changelog section found for version ${version}`);
                      }

                      const findEnd = (from) => {
                        const index = lines.findIndex(
                          (line, i) => i > from && line.startsWith("## ["),
                        );
                        return index === -1 ? lines.length : index;
                      };
                      const end = findEnd(start);

                      const current = lines.slice(start, end).join("\n").trim();
                      if (!lines.slice(start + 1, end).join("").trim()) {
                        throw new Error(`Changelog section for version ${version} is empty`);
                      }

                      const sections = [current];

                      // Include the previous changelog version when it has no GitHub release yet
                      const previousHeading = lines[end] ?? "";
                      const previousVersion = /^## \[([^\]]+)\]/.exec(previousHeading)?.[1];
                      if (previousVersion) {
                        const response = await fetch(
                          `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/releases/tags/v${previousVersion}`,
                          {
                            headers: {
                              Authorization: `Bearer ${process.env.GH_TOKEN}`,
                              Accept: "application/vnd.github+json",
                            },
                          },
                        );
                        if (response.status === 404) {
                          const previous = lines.slice(end, findEnd(end)).join("\n").trim();
                          if (previous.split("\n").slice(1).join("").trim()) {
                            sections.push(previous);
                          }
                        } else if (!response.ok) {
                          throw new Error(
                            `Could not check GitHub release v${previousVersion} (HTTP ${response.status})`,
                          );
                        }
                      }

                      let notes = `## Changelog\n\n${sections.join("\n\n")}`;
                      if (process.env.PUBLISH_DOCKER === "true") {
                        const dockerImage = `${process.env.IMAGE_NAME.toLowerCase()}:${version}`;
                        notes = `Pull the Docker image for this release:\n\n\`\`\`sh\ndocker pull ${dockerImage}\n\`\`\`\n\n---\n\n${notes}`;
                      }
                      const delimiter = `NOTES_${randomUUID()}`;
                      appendFileSync(
                        process.env.GITHUB_OUTPUT,
                        `release_notes<<${delimiter}\n${notes}\n${delimiter}\n`,
                      );
                      summary += `\n---\n\n### Release notes\n\n${notes}\n`;
                    }

                    appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
                    console.log(summary);
                  '

    check:
        needs: prepare
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Ensure version tag does not exist
              if: inputs.create_tag
              env:
                  VERSION: ${{ needs.prepare.outputs.version }}
              run: |
                  tag="v${VERSION}"
                  existing_tag=$(git ls-remote --tags origin "refs/tags/${tag}")
                  if [ -n "$existing_tag" ]; then
                      echo "::error::Git tag ${tag} already exists; refusing to publish this version."
                      printf '\n> [!WARNING]\n> Git tag `%s` already exists; refusing to publish this version.\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
                      exit 1
                  fi
                  printf '\n> [!NOTE]\n> Git tag `%s` does not exist yet.\n' "$tag" >> "$GITHUB_STEP_SUMMARY"

            - name: Ensure GitHub release does not exist
              if: inputs.create_release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ needs.prepare.outputs.version }}
              run: |
                  tag="v${VERSION}"
                  status=$(curl --silent --show-error \
                      --output "$RUNNER_TEMP/release.json" \
                      --write-out '%{http_code}' \
                      --header "Authorization: Bearer ${GH_TOKEN}" \
                      --header "Accept: application/vnd.github+json" \
                      "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")

                  if [ "$status" = "200" ]; then
                      echo "::error::GitHub release ${tag} already exists; refusing to publish this version."
                      printf '\n> [!WARNING]\n> GitHub release `%s` already exists; refusing to publish this version.\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
                      exit 1
                  elif [ "$status" != "404" ]; then
                      echo "::error::Could not check GitHub release ${tag} (HTTP ${status})."
                      cat "$RUNNER_TEMP/release.json"
                      printf '\n> [!WARNING]\n> Could not check GitHub release `%s` (HTTP %s).\n' "$tag" "$status" >> "$GITHUB_STEP_SUMMARY"
                      exit 1
                  fi
                  printf '\n> [!NOTE]\n> GitHub release `%s` does not exist yet.\n' "$tag" >> "$GITHUB_STEP_SUMMARY"

            - name: Set up Docker Buildx for image check
              if: inputs.publish_docker
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry for image check
              if: inputs.publish_docker
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Ensure Docker image version does not exist
              if: inputs.publish_docker
              env:
                  VERSION: ${{ needs.prepare.outputs.version }}
                  IMAGE_NAME: ${{ env.IMAGE_NAME }}
              run: |
                  image="${REGISTRY}/${IMAGE_NAME,,}:${VERSION}"
                  if output=$(docker buildx imagetools inspect "$image" 2>&1); then
                      echo "::error::Docker image ${image} already exists; refusing to publish this version."
                      printf '\n> [!WARNING]\n> Docker image `%s` already exists; refusing to publish this version.\n' "$image" >> "$GITHUB_STEP_SUMMARY"
                      exit 1
                  elif printf '%s' "$output" | grep -Eqi 'manifest unknown|no such manifest|: not found$'; then
                      echo "Docker image ${image} does not exist."
                      printf '\n> [!NOTE]\n> Docker image `%s` does not exist yet.\n' "$image" >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo "::error::Could not check Docker image ${image}."
                      printf '%s\n' "$output"
                      printf '\n> [!WARNING]\n> Could not check Docker image `%s`.\n' "$image" >> "$GITHUB_STEP_SUMMARY"
                      exit 1
                  fi

    approval:
        needs: [prepare, check]
        if: inputs.create_tag || inputs.create_release || inputs.publish_docker
        runs-on: ubuntu-latest
        environment: Jappan-Env
        steps:
            - name: Approve publish preview
              run: echo "Publish preview approved."

    github-publish:
        needs: [prepare, check, approval]
        if: inputs.create_tag || inputs.create_release || inputs.publish_docker
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Create and push Git tag
              id: tag
              if: inputs.create_tag
              env:
                  VERSION: ${{ needs.prepare.outputs.version }}
              run: |
                  tag="v${VERSION}"
                  git tag "$tag" "$GITHUB_SHA"
                  git push origin "$tag"

            - name: Create GitHub release
              id: release
              if: inputs.create_release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ needs.prepare.outputs.version }}
                  RELEASE_NOTES: ${{ needs.prepare.outputs.release_notes }}
              run: |
                  tag="v${VERSION}"
                  gh release create "$tag" \
                      --title "$tag" \
                      --verify-tag \
                      --notes "$RELEASE_NOTES"

            - name: Write publish summary
              if: always()
              env:
                  VERSION: ${{ needs.prepare.outputs.version }}
                  JOB_STATUS: ${{ job.status }}
                  TAG_OUTCOME: ${{ steps.tag.outcome }}
                  RELEASE_OUTCOME: ${{ steps.release.outcome }}
              run: |
                  report() {
                      case "$2" in
                          success) echo "> - ✅ $1" ;;
                          failure) echo "> - ❌ $1" ;;
                      esac
                  }
                  if [ "$JOB_STATUS" = "success" ]; then
                      alert="NOTE"
                      title="Published \`v${VERSION}\` to GitHub."
                  else
                      alert="WARNING"
                      title="Publishing \`v${VERSION}\` to GitHub did not complete successfully."
                  fi
                  {
                      echo
                      echo "> [!${alert}]"
                      echo "> ${title}"
                      echo ">"
                      report "Git tag \`v${VERSION}\`" "$TAG_OUTCOME"
                      report "GitHub release \`v${VERSION}\`" "$RELEASE_OUTCOME"
                  } >> "$GITHUB_STEP_SUMMARY"

    docker:
        needs: [prepare, github-publish]
        if: inputs.publish_docker && needs.github-publish.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Read description from README
              id: readme
              run: |
                  description=$(awk 'NR > 1 && NF { print; exit }' README.md)
                  if [ -z "$description" ]; then
                      echo "::error::Could not read a description from README.md."
                      exit 1
                  fi
                  echo "description=${description}" >> "$GITHUB_OUTPUT"

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              env:
                  DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.description=${{ steps.readme.outputs.description }}
                      org.opencontainers.image.licenses=ISC
                      org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
                  tags: |
                      type=raw,value=${{ needs.prepare.outputs.version }}
                      type=raw,value=latest

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  annotations: ${{ steps.meta.outputs.annotations }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Print published image and tags
              env:
                  TAGS: ${{ steps.meta.outputs.tags }}
              run: |
                  number=1
                  printf '%s\n' "$TAGS" | while IFS= read -r tag; do
                      [ -n "$tag" ] || continue
                      printf '%d. %s\n' "$number" "$tag"
                      number=$((number + 1))
                  done

            - name: Write publish summary
              if: always()
              env:
                  VERSION: ${{ needs.prepare.outputs.version }}
                  JOB_STATUS: ${{ job.status }}
                  TAGS: ${{ steps.meta.outputs.tags }}
              run: |
                  {
                      echo
                      if [ "$JOB_STATUS" = "success" ]; then
                          echo "> [!NOTE]"
                          echo "> Published Docker image \`${VERSION}\`."
                          echo ">"
                          printf '%s\n' "$TAGS" | while IFS= read -r tag; do
                              [ -n "$tag" ] && echo "> - ✅ \`${tag}\`"
                          done
                      else
                          echo "> [!WARNING]"
                          echo "> Publishing Docker image \`${VERSION}\` did not complete successfully."
                      fi
                  } >> "$GITHUB_STEP_SUMMARY"
