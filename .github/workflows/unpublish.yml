name: Unpublish

on:
    workflow_dispatch:
        inputs:
            version_override:
                description: Version to unpublish instead of the package.json version (leave empty to use package.json)
                type: string
                default: ""
            delete_tag:
                description: Delete the version Git tag
                type: boolean
                default: true
            delete_release:
                description: Delete the GitHub release
                type: boolean
                default: true
            delete_docker:
                description: Delete the Docker image version
                type: boolean
                default: true

permissions:
    contents: write
    packages: write

jobs:
    prepare:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.value }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Read version and prepare unpublish preview
              id: version
              env:
                  DELETE_TAG: ${{ inputs.delete_tag }}
                  DELETE_RELEASE: ${{ inputs.delete_release }}
                  DELETE_DOCKER: ${{ inputs.delete_docker }}
                  VERSION_OVERRIDE: ${{ inputs.version_override }}
              run: |
                  version="${VERSION_OVERRIDE//[[:space:]]/}"
                  if [ -z "$version" ]; then
                      version=$(node -p "require('./package.json').version")
                  elif [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
                      echo "::error::Invalid version override: ${version}"
                      exit 1
                  fi
                  echo "value=${version}" >> "$GITHUB_OUTPUT"
                  {
                      echo "## Unpublish preview"
                      echo
                      echo "Version: \`v${version}\`"
                      echo
                      echo "- Delete Git tag: ${DELETE_TAG}"
                      echo "- Delete GitHub release: ${DELETE_RELEASE}"
                      echo "- Delete Docker image version: ${DELETE_DOCKER}"
                  } | tee -a "$GITHUB_STEP_SUMMARY"

    check:
        needs: prepare
        runs-on: ubuntu-latest
        outputs:
            docker_version_id: ${{ steps.docker-version.outputs.version_id }}
            docker_delete_package: ${{ steps.docker-version.outputs.delete_package }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Check Git tag exists
              if: inputs.delete_tag
              env:
                  VERSION: ${{ needs.prepare.outputs.version }}
              run: |
                  tag="v${VERSION}"
                  if ! existing_tag=$(git ls-remote --tags origin "refs/tags/${tag}"); then
                      echo "::error::Could not check whether Git tag ${tag} exists."
                      printf '\n> [!WARNING]\n> Could not check whether Git tag `%s` exists.\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
                      exit 1
                  fi
                  if [ -z "$existing_tag" ]; then
                      echo "::error::Git tag ${tag} does not exist; nothing to delete."
                      printf '\n> [!WARNING]\n> Git tag `%s` does not exist; nothing to delete.\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
                      exit 1
                  fi
                  echo "Git tag ${tag} exists and can be deleted."
                  printf '\n> [!NOTE]\n> Git tag `%s` exists and can be deleted.\n' "$tag" >> "$GITHUB_STEP_SUMMARY"

            - name: Check GitHub release exists
              if: inputs.delete_release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ needs.prepare.outputs.version }}
              run: |
                  tag="v${VERSION}"
                  status=$(curl --silent --show-error \
                      --output "$RUNNER_TEMP/release.json" \
                      --write-out '%{http_code}' \
                      --header "Authorization: Bearer ${GH_TOKEN}" \
                      --header "Accept: application/vnd.github+json" \
                      "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")

                  if [ "$status" = "404" ]; then
                      echo "::error::GitHub release ${tag} does not exist; nothing to delete."
                      printf '\n> [!WARNING]\n> GitHub release `%s` does not exist; nothing to delete.\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
                      exit 1
                  elif [ "$status" != "200" ]; then
                      echo "::error::Could not check GitHub release ${tag} (HTTP ${status})."
                      cat "$RUNNER_TEMP/release.json"
                      printf '\n> [!WARNING]\n> Could not check GitHub release `%s` (HTTP %s).\n' "$tag" "$status" >> "$GITHUB_STEP_SUMMARY"
                      exit 1
                  fi
                  echo "GitHub release ${tag} exists and can be deleted."
                  printf '\n> [!NOTE]\n> GitHub release `%s` exists and can be deleted.\n' "$tag" >> "$GITHUB_STEP_SUMMARY"

            - name: Check Docker image version exists
              id: docker-version
              if: inputs.delete_docker
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ needs.prepare.outputs.version }}
              run: |
                  package_name="${GITHUB_REPOSITORY#*/}"
                  package_name="${package_name,,}"
                  versions=$(gh api --paginate \
                      --jq '.[] | [.id, (.metadata.container.tags | join(","))] | @tsv' \
                      "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${package_name}/versions?per_page=100")

                  if [ -z "$versions" ]; then
                      echo "::error::Docker image version ${VERSION} does not exist; nothing to delete."
                      printf '\n> [!WARNING]\n> Docker image version `%s` does not exist; nothing to delete.\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"
                      exit 1
                  fi

                  mapfile -t versions <<< "$versions"
                  matches=()
                  tagged_version_count=0
                  for entry in "${versions[@]}"; do
                      IFS=$'\t' read -r candidate_id tags <<< "$entry"
                      if [ -n "$tags" ]; then
                          tagged_version_count=$((tagged_version_count + 1))
                      fi
                      case ",${tags}," in
                          *,"${VERSION}",*) matches+=("$entry") ;;
                      esac
                  done

                  if [ "${#matches[@]}" -eq 0 ]; then
                      echo "::error::Docker image version ${VERSION} does not exist; nothing to delete."
                      printf '\n> [!WARNING]\n> Docker image version `%s` does not exist; nothing to delete.\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"
                      exit 1
                  fi

                  if [ "${#matches[@]}" -ne 1 ]; then
                      echo "::error::Found multiple Docker image versions tagged ${VERSION}; refusing ambiguous deletion."
                      printf '\n> [!WARNING]\n> Found multiple Docker image versions tagged `%s`; refusing ambiguous deletion.\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"
                      exit 1
                  fi

                  IFS=$'\t' read -r version_id tags <<< "${matches[0]}"
                  if [[ ! "$version_id" =~ ^[0-9]+$ ]]; then
                      echo "::error::GitHub returned an invalid Docker package version ID."
                      printf '\n> [!WARNING]\n> GitHub returned an invalid Docker package version ID.\n' >> "$GITHUB_STEP_SUMMARY"
                      exit 1
                  fi

                  echo "version_id=${version_id}" >> "$GITHUB_OUTPUT"
                  if [ "$tagged_version_count" -eq 1 ]; then
                      echo "delete_package=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "delete_package=false" >> "$GITHUB_OUTPUT"
                  fi
                  {
                      echo
                      if [ "$tagged_version_count" -eq 1 ]; then
                          echo "> [!WARNING]"
                          echo "> This is the last tagged Docker version. Unpublishing it will delete the entire container package."
                      else
                          echo "> [!NOTE]"
                          echo "> Docker image version \`${VERSION}\` exists and can be deleted."
                      fi
                      echo ">"
                      echo "> - Package version ID: \`${version_id}\`"
                      echo "> - Tags on that version: \`${tags}\`"
                  } | tee -a "$GITHUB_STEP_SUMMARY"

    approval:
        needs: [prepare, check]
        if: inputs.delete_tag || inputs.delete_release || inputs.delete_docker
        runs-on: ubuntu-latest
        environment: Jappan-Env
        steps:
            - name: Approve unpublish preview
              run: echo "Unpublish preview approved."

    github-unpublish:
        needs: [prepare, check, approval]
        if: inputs.delete_tag || inputs.delete_release
        runs-on: ubuntu-latest
        steps:
            - name: Delete GitHub release
              id: release
              if: inputs.delete_release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ needs.prepare.outputs.version }}
              run: gh release delete "v${VERSION}" --yes --repo "$GITHUB_REPOSITORY"

            - name: Delete Git tag
              id: tag
              if: inputs.delete_tag
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ needs.prepare.outputs.version }}
              run: gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/tags/v${VERSION}"

            - name: Write unpublish summary
              if: always()
              env:
                  VERSION: ${{ needs.prepare.outputs.version }}
                  JOB_STATUS: ${{ job.status }}
                  TAG_OUTCOME: ${{ steps.tag.outcome }}
                  RELEASE_OUTCOME: ${{ steps.release.outcome }}
              run: |
                  report() {
                      case "$2" in
                          success) echo "> - ✅ $1" ;;
                          failure) echo "> - ❌ $1" ;;
                      esac
                  }
                  if [ "$JOB_STATUS" = "success" ]; then
                      alert="NOTE"
                      title="Removed \`v${VERSION}\` from GitHub."
                  else
                      alert="WARNING"
                      title="Removing \`v${VERSION}\` from GitHub did not complete successfully."
                  fi
                  {
                      echo
                      echo "> [!${alert}]"
                      echo "> ${title}"
                      echo ">"
                      report "Deleted GitHub release \`v${VERSION}\`" "$RELEASE_OUTCOME"
                      report "Deleted Git tag \`v${VERSION}\`" "$TAG_OUTCOME"
                  } >> "$GITHUB_STEP_SUMMARY"

    docker-unpublish:
        needs: [prepare, check, approval, github-unpublish]
        if: >-
            always() &&
            inputs.delete_docker &&
            needs.prepare.result == 'success' &&
            needs.check.result == 'success' &&
            needs.approval.result == 'success' &&
            (needs.github-unpublish.result == 'success' || needs.github-unpublish.result == 'skipped')
        runs-on: ubuntu-latest
        steps:
            - name: Delete Docker image version
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION_ID: ${{ needs.check.outputs.docker_version_id }}
                  DELETE_PACKAGE: ${{ needs.check.outputs.docker_delete_package }}
              run: |
                  package_name="${GITHUB_REPOSITORY#*/}"
                  package_name="${package_name,,}"
                  if [ "$DELETE_PACKAGE" = "true" ]; then
                      gh api --method DELETE \
                          "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${package_name}"
                      echo "Deleted Docker container package ${package_name} because it contained the last tagged version."
                  else
                      gh api --method DELETE \
                          "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${package_name}/versions/${VERSION_ID}"
                      echo "Deleted Docker package version ${VERSION_ID}."
                  fi

            - name: Write unpublish summary
              if: always()
              env:
                  VERSION: ${{ needs.prepare.outputs.version }}
                  JOB_STATUS: ${{ job.status }}
                  DELETE_PACKAGE: ${{ needs.check.outputs.docker_delete_package }}
              run: |
                  if [ "$DELETE_PACKAGE" = "true" ]; then
                      target="the Docker container package (it held the last tagged version)"
                  else
                      target="Docker image version \`${VERSION}\`"
                  fi
                  {
                      echo
                      if [ "$JOB_STATUS" = "success" ]; then
                          echo "> [!NOTE]"
                          echo "> Deleted ${target}."
                      else
                          echo "> [!WARNING]"
                          echo "> Deleting ${target} did not complete successfully."
                      fi
                  } >> "$GITHUB_STEP_SUMMARY"
